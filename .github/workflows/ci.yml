name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a previous in-flight run on the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The NNUE archsimd package + the hand-written AVX2 kernel are gated behind GOEXPERIMENT=simd (Go 1.26.x: 1.27
# changed the archsimd API, and setup-go takes go.mod's 1.26 line).
# The Makefile exports it too, but set it here so the direct `go`/`gofmt` steps agree.
env:
  GOEXPERIMENT: simd

jobs:
  # Every job runs on a GitHub-hosted runner, free for a public repository, its image pinned by version (ubuntu-24.04,
  # windows-2025) rather than -latest, so an image change is a change made here. Each job starts on a fresh machine:
  # setup-go installs the Go go.mod pins, and the image carries the rest (make, gcc for the race pass's cgo, Git Bash).
  # The hosted fleet's CPU model is not promised, which is what the AVX2 gate in the build jobs is for.

  # Primary build + test gate on Linux via the `make` wrapper (which sets GOEXPERIMENT=simd). `make check`
  # runs perft, SEE, Bratko-Kopec, the NNUE gates, chess-clock timing, and the UCI-protocol test — including
  # the bench determinism signature.
  build-test:
    name: build + test (make check)
    runs-on: ubuntu-24.04
    steps:
      # Full history and the tags (not a shallow clone): tools/version.sh derives the version from them.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Check runner has AVX2
        # The engine emits 256-bit AVX2 (NNUE SIMD kernels), so the test binaries need an AVX2 CPU.
        # The hosted runners' hardware is not promised, so this gate is what stops a runner that lacks
        # AVX2 from reporting a green build it never actually ran.
        run: |
          grep -q avx2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2 — cannot run the SIMD engine"; exit 1; }
      - name: Build + test
        run: make -j"$(nproc)" check

  # Coverage gate: `make cover` runs the whole suite instrumented (-coverpkg=./..., so the engine, engine/nnue and the
  # binary's main package are all counted) and fails when the total statement coverage is under the Makefile's
  # COVER_MIN (90 %), the one place the threshold is written. The total and the functions short of 100 % go to the
  # job summary.
  coverage:
    name: coverage (make cover, gate COVER_MIN)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Check runner has AVX2
        run: |
          grep -q avx2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2 — cannot run the SIMD engine"; exit 1; }
      - name: Coverage (fails under COVER_MIN)
        run: |
          set -o pipefail
          make cover 2>&1 | tee cover.log
      - name: Job summary
        if: always()
        run: |
          [ -f coverage.out ] || exit 0
          {
            echo '### Statement coverage'
            echo
            grep -E '^total statement coverage|under the' cover.log || true
            echo
            echo '<details><summary>Functions short of 100 %</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out | grep -v '100.0%' || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  # Style gate: the tree must be gofmt-clean and vet-clean.
  format:
    name: gofmt + vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...

  # Static analysis beyond vet: staticcheck (incl. dead code), errcheck, ineffassign, copyloopvar, misspell.
  # The linter set is deliberately conservative — see .golangci.yml for why (bit-parity).
  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  # The scalar-fallback build: GOEXPERIMENT is cleared, so the generic (non-SIMD, non-NEON) kernels compile.
  # This is the ONLY job that compiles kernels_generic.go / dot_generic.go / prefetch_generic.go at all — every
  # other job builds amd64+simd or arm64. README advertises "a plain `go build` on any other target falls back
  # to bit-identical scalar kernels"; asserting the golden bench signature here is what turns that claim into a
  # tested invariant. GOAMD64 is left at the v1 default on purpose: the fallback must run on ANY amd64 CPU.
  scalar:
    name: scalar fallback (no simd)
    runs-on: ubuntu-24.04
    env:
      GOEXPERIMENT: "" # override the workflow-level simd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Build (scalar kernels)
        run: |
          go build ./...
          go build -o pawnstar-go-scalar .
      - name: Test
        run: go test ./engine/ -short
      - name: Bench signature must equal the SIMD golden (kernels are bit-identical)
        run: |
          nodes=$(printf 'bench\nquit\n' | ./pawnstar-go-scalar | grep -E '^[0-9]+ nodes' | awk '{print $1}')
          echo "scalar bench: $nodes nodes"
          [ "$nodes" = "5617906" ] || {
            echo "::error::scalar bench $nodes != golden 5617906 — the scalar kernels diverged from SIMD"
            exit 1
          }

  # ---------------------------------------------------------------------------------------------------------
  # The two NNUE SHAPES. The DEFAULT since release 2.0.0 is the shared architecture every
  # reckless-technology chess engine is unified on - horizontal king mirroring plus 8 material output heads -
  # and every job above exercises it, because it is what a build with no tags produces and what the shipped
  # net was trained for. These two jobs cover what those leave out: v12's older shape, which is now the
  # TAGGED build and which nothing else compiles, and the cross-port node-count signature.
  #
  # A gated path with no CI rots silently, which is the whole reason both jobs exist. This port is the one
  # that proves it: its transposition table defaulted to 512 MB against the C++ and Rust ports' 64 MB from
  # May until 2026-10-27, through every release, because the only cross-port gate that ran was `bench` and
  # `bench` pins the table to 64 MB in all three. A gate that controls for a difference cannot detect it.
  #
  # Their own jobs rather than a tag matrix on build-test, for three reasons. The default shape's bench
  # signature, its coverage percentage and its artifacts must not move, and a matrix would recompute all of
  # them; the two shapes' failures stay distinguishable at a glance, where a matrix leg reads as "the build
  # broke"; and the jobs run concurrently with the others, so they add names to the list rather than minutes
  # to the critical path. amd64/simd only, like build-test: the shape is integer arithmetic chosen at compile
  # time, and the scalar job already proves the two kernel paths are bit-identical.
  # ---------------------------------------------------------------------------------------------------------
  legacy-shape:
    name: v12 NNUE shape (no mirroring, 1 output head)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Check runner has AVX2
        run: |
          grep -q avx2 /proc/cpuinfo             || { echo "::error::runner CPU lacks AVX2 - cannot run the SIMD engine"; exit 1; }
      # The whole suite plus the race pass at v12's retained shape, through the same `make check` the
      # default-shape job runs - the build tags reach every `go build`, `go test` and `go vet` through the
      # Makefile's GOTAGS, including the engine binary the UCI subprocess tests drive, so no part of it can
      # be left at the other shape. This tree holds NO net at that shape (pawnstar-v12.bin was removed in
      # 2.0.0), so the gates whose expected values belong to the shipped net skip here and say so
      # (skipWithoutTheShippedNet); the accumulator gates install this shape's own synthetic net instead and
      # run at both shapes, which is what keeps the retained shape honestly exercised rather than merely
      # compiled.
      - name: Build + test at v12's shape
        run: |
          set -o pipefail
          make -j"$(nproc)" KING_MIRRORING=0 OUTPUT_BUCKETS=1 build check 2>&1 | tee legacy-shape-check.log

  cross-port-signature:
    name: cross-port node-count signature
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Check runner has AVX2
        run: |
          grep -q avx2 /proc/cpuinfo             || { echo "::error::runner CPU lacks AVX2 - cannot run the SIMD engine"; exit 1; }
      - name: Build (default shape) and write the synthetic net at it
        run: |
          make build
          make synthetic-net NET=synthetic-net.bin
      # The cross-port gate, run over the SYNTHETIC net rather than the shipped one: `bench` already pins the
      # shipped net's total (TestUCIBenchDeterminism), and the synthetic net is the one whose bytes the three
      # ports generate themselves and can therefore compare without shipping anything between them.
      # `--hash` is mandatory in the script and its value is printed beside every node count: table size
      # changes the collision pattern and so the node count at a fixed depth, so a node count with no table
      # size next to it is not comparable - and it was precisely the absence of one that hid this port's own
      # 512-vs-64 default. The script asserts the synthetic net's size, SHA-256 and RNNUE1 header BEFORE
      # searching it, so a drifted generator fails as a drifted generator rather than as a search regression.
      # The same file, with the same six expected results, is committed in pawnstar and pawnstar-rs: three
      # independent assertions against one shared constant, so any port that drifts fails its own CI at its
      # own commit, with no cross-repository artifact fetch to go stale.
      - name: Cross-port node-count signature (six positions, depth 8, Hash 64 MB)
        run: |
          set -o pipefail
          tools/new-shape-signature.sh --hash 64 --net synthetic-net.bin --depth 8               ./pawnstar-go 2>&1 | tee new-shape-signature.log
      - name: Signature in the job summary
        if: always()
        run: |
          [ -f new-shape-signature.log ] || exit 0
          {
            echo '### The shared NNUE shape: cross-port node-count signature'
            echo '```'
            cat new-shape-signature.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # ---------------------------------------------------------------------------------------------------------
  # Build artifacts: a native engine binary for Linux and Windows plus a docs bundle and source archive, all
  # versioned from the git tags by tools/version.sh (hence the full-history checkouts). Binaries upload only
  # after that platform's build AND test pass (the upload is a later step, so a failed build/test ends the job
  # first); each binary job is self-contained — it builds the versioned binary
  # (pawnstar-go_<major>_<minor>_<build>) and runs the tests on its own runner. Download them from the run's
  # "Artifacts" section, for a look at a commit's build. Releases are built by release.yml, from nothing, on a
  # pushed vMAJOR.MINOR tag, and signed - none of these artifacts is released. No macOS job here: the arm64
  # build and its tests run in release.yml, which refuses to publish if they fail.
  # ---------------------------------------------------------------------------------------------------------

  # Linux x86-64 (AVX2 SIMD kernels, via the make wrapper).
  artifact-linux:
    name: artifact (linux amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Check runner has AVX2
        run: |
          grep -q avx2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2 — cannot run the SIMD engine"; exit 1; }
      - name: Build versioned binary
        run: make build
      - name: Test
        run: make -j"$(nproc)" check
      - name: Upload engine binary
        uses: actions/upload-artifact@v6
        with:
          name: pawnstar-go-linux-amd64
          path: pawnstar-go_[0-9]*_[0-9]*_[0-9]* # the versioned binary, not the pawnstar-go symlink
          if-no-files-found: error

  # Windows x86-64 (AVX2 SIMD kernels). Build and test with go directly (bash shell for tools/version.sh and
  # the ldflags, as the Makefile passes them), as release.yml does; the race pass, last, brings its own make.
  artifact-windows:
    name: artifact (windows amd64)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Build versioned binary
        run: |
          version=$(tools/version.sh)
          go build -ldflags "-X pawnstar-go/engine.version=$version" -o "pawnstar-go_${version//./_}.exe" .
      # The engine imports system DLLs alone (no cgo: no C runtime, no MinGW runtime), so it starts on a Windows with
      # no Visual C++ redistributable. A C or C++ runtime DLL among its imports fails the job.
      - name: Windows DLLs the engine imports
        shell: pwsh
        run: |
          $binary = Get-ChildItem pawnstar-go_*.exe | Select-Object -First 1
          if (-not $binary) { throw "the engine was not built" }
          pwsh -NoProfile -File tools/windows-dependents.ps1 $binary.FullName
          if ($LASTEXITCODE -ne 0) { throw "the engine imports a DLL outside the allowlist" }
      - name: Test
        run: go test ./...
      # The race pass the Linux jobs run in `make check`: `make race` itself, so the two share its -run regex. -race
      # needs cgo and a C compiler: MSYS2's CLANG64 clang, from an MSYS2 of this job's own that setup-msys2 installs and
      # caches (release: true) rather than the image's C:\msys64, with mingw32-make (MSYS2's native GNU make) to run the
      # Makefile from this Git Bash shell - the toolchain tools/setup-dev.ps1 gives a development machine. The target
      # switches cgo on; CC names the compiler, and clang64\bin goes on the PATH for its tools and any runtime DLL the
      # binaries load.
      - name: MSYS2 CLANG64 (clang and make for the race pass)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: true
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-make
      - name: Race detector (make race)
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          clang64="$(cygpath -u "$MSYS2_LOCATION")/clang64/bin"
          export PATH="$clang64:$PATH"
          CC="$(cygpath -m "$clang64/clang.exe")"
          export CC
          mingw32-make race
      - name: Upload engine binary
        uses: actions/upload-artifact@v6
        with:
          name: pawnstar-go-windows-amd64
          path: pawnstar-go_*.exe
          if-no-files-found: error

  # Documentation bundle, versioned like the binaries, made as release.yml makes it (`make docs-bundle`; the
  # Makefile says what the bundle holds). No source archive: a release publishes none, so CI builds none.
  artifact-docs:
    name: artifact (docs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Generate docs bundle
        run: make docs-bundle
      - name: Upload docs bundle
        uses: actions/upload-artifact@v6
        with:
          name: pawnstar-go-docs
          path: pawnstar-go-*-docs.zip
          if-no-files-found: error
