name: Release

# Manually promote a successful CI run into a GitHub Release. The Linux and Windows engine binaries, the docs
# bundle and the source archive are downloaded from the chosen run's artifacts — not rebuilt or regenerated
# (CI produces the docs + source bundles on every run, from that run's exact commit). The macOS arm64 binary is
# the one thing built here, at that same commit, with its full test suite: macOS is absent from per-push CI on
# cost grounds (a hosted macOS minute bills ten Linux minutes on a private repo), so the arm64 build runs once
# per release instead of on every push — and the release refuses to publish if that job fails, so the arm64
# binary is still exactly the one that was tested. Manual-only (workflow_dispatch); dispatch is restricted to
# users with write access, so only maintainers can cut a release. Mirrors the C++ engine's release workflow.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run to promote (numeric run id). Leave blank to use the latest successful CI run on main."
        required: false
        type: string
      draft:
        description: "Create the release as a draft (review before publishing)."
        required: false
        type: boolean
        default: true

# contents: write to create the tag + release; actions: read for gh run view/list/download.
permissions:
  contents: write
  actions: read

# The NNUE archsimd package + the hand-written AVX2 kernel are gated behind GOEXPERIMENT=simd (Go 1.26+); on
# arm64 the hand-written NEON kernels need no experiment, but the Makefile exports it and ci.yml sets it, so
# set it here too and the macOS build agrees with the one CI used to run.
env:
  GOEXPERIMENT: simd

jobs:
  # 1) Resolve the run id (input, or the latest successful CI run on main) and validate it is a green CI run.
  #    Capture the run's commit SHA — the macOS build and the release both work at exactly that commit.
  resolve:
    name: resolve CI run
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve and validate CI run
        id: resolve
        run: |
          set -euo pipefail
          run_id="${{ inputs.run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')
            [ -n "$run_id" ] || { echo "::error::no successful CI run found on main"; exit 1; }
            echo "No run_id given; using latest successful CI run on main: $run_id"
          fi
          info=$(gh run view "$run_id" --json workflowName,conclusion,headSha)
          workflow=$(echo "$info" | jq -r '.workflowName')
          conclusion=$(echo "$info" | jq -r '.conclusion')
          sha=$(echo "$info" | jq -r '.headSha')
          [ "$workflow" = "CI" ]        || { echo "::error::run $run_id is workflow '$workflow', not 'CI'"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "::error::run $run_id did not succeed (conclusion=$conclusion)"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Promoting CI run $run_id at commit $sha"

  # 2) macOS arm64 (Apple Silicon), built and tested at the promoted commit and handed to the release job as an
  #    artifact — the steps the per-push CI job ran before macOS moved here. amd64-only files (archsimd + the
  #    AVX2 asm) are build-tag-excluded; arm64 builds the hand-written NEON NNUE kernels
  #    (engine/nnue/kernels_arm64.s + dot_arm64.s) — no AVX2 check.
  #    Runs on the org's Apple-silicon runner (reckless-ci-mac-1), not a hosted macos-latest runner.
  macos:
    name: build + test (macos arm64)
    needs: resolve
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # Full history so `git rev-list --count HEAD` yields the true build number for the version-named binary.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum / external deps to cache
      - name: Build versioned binary
        run: make build
      - name: Test
        run: make -j"$(sysctl -n hw.logicalcpu)" check
      - name: Upload engine binary
        uses: actions/upload-artifact@v6
        with:
          name: pawnstar-go-macos-arm64
          path: pawnstar-go_[0-9]*_[0-9]*_[0-9]*
          if-no-files-found: error

  release:
    name: promote CI run to release
    needs: [resolve, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # 3) Download the artifacts CI built and tested for that run (Linux and Windows binaries, docs bundle,
      #    source archive), and the macOS binary the job above built at the same commit — into the same tree,
      #    so the staging step below reads them all alike.
      - name: Download CI artifacts
        run: gh run download "${{ needs.resolve.outputs.run_id }}" --dir ci-artifacts
      - name: Download the macOS binary built above
        uses: actions/download-artifact@v6
        with:
          name: pawnstar-go-macos-arm64
          path: ci-artifacts/pawnstar-go-macos-arm64

      # 4) Derive the version from the linux binary filename (pawnstar-go_0_1_141 -> 0.1.141) so the tag
      #    always matches the built binary, and stage all assets under version-suffixed names. The docs and
      #    source bundles were version-stamped by CI from the same commit, and the macOS binary was built at
      #    it; copying each by that exact name asserts the versions agree (the cp fails loudly if they drift).
      - name: Stage release assets
        id: stage
        run: |
          set -euo pipefail
          linux_bin=$(ls ci-artifacts/pawnstar-go-linux-amd64/pawnstar-go_[0-9]*_[0-9]*_[0-9]*)
          base=$(basename "$linux_bin")
          ver=$(echo "$base" | sed -E 's/^pawnstar-go_([0-9]+)_([0-9]+)_([0-9]+)$/\1.\2.\3/')
          [ "$ver" != "$base" ] || { echo "::error::could not parse version from '$base'"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          mkdir -p assets
          cp ci-artifacts/pawnstar-go-linux-amd64/pawnstar-go_[0-9]*_[0-9]*_[0-9]*      "assets/pawnstar-go-$ver-linux-amd64"
          cp "ci-artifacts/pawnstar-go-macos-arm64/$base"                               "assets/pawnstar-go-$ver-macos-arm64"
          cp ci-artifacts/pawnstar-go-windows-amd64/pawnstar-go_*.exe                  "assets/pawnstar-go-$ver-windows-amd64.exe"
          cp "ci-artifacts/pawnstar-go-docs/pawnstar-go-$ver-docs.zip"                 assets/
          cp "ci-artifacts/pawnstar-go-source/pawnstar-go-$ver-source.tar.gz"          assets/
          echo "Staged assets for version $ver"

      # 5) Create the release at the promoted commit with the staged assets. Notes = a provenance line (which
      #    CI run / commit, and that this run built the macOS binary) plus GitHub's auto-generated changelog.
      #    Fails if the tag already exists (no clobber).
      - name: Create release
        run: |
          set -euo pipefail
          ver="${{ steps.stage.outputs.version }}"
          tag="v$ver"
          sha="${{ needs.resolve.outputs.sha }}"
          run_id="${{ needs.resolve.outputs.run_id }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release/tag $tag already exists — refusing to clobber"; exit 1
          fi
          changelog=$(gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$sha" --jq '.body')
          {
            echo "Promoted from CI run [#$run_id](https://github.com/$GH_REPO/actions/runs/$run_id) at commit \`$sha\`;"
            echo "the macOS arm64 binary was built and tested at the same commit by release run [#$GITHUB_RUN_ID](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "$changelog"
          } > notes.md
          draft_flag=""
          if [ "${{ inputs.draft }}" = "true" ]; then draft_flag="--draft"; fi
          url=$(gh release create "$tag" \
            --target "$sha" \
            --title "Pawnstar-Go $ver" \
            --notes-file notes.md \
            $draft_flag \
            assets/*)
          echo "Created release $tag: $url"
          {
            echo "### Release $tag"
            echo "- Promoted CI run: #$run_id"
            echo "- macOS arm64 built by: this run (#$GITHUB_RUN_ID)"
            echo "- Commit: \`$sha\`"
            echo "- Draft: ${{ inputs.draft }}"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
